<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-cp" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#00F0FF" />
      <stop offset="70%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="grad-bt" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="grad-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Centered vertically at X=100, Y=100) -->
  <g transform="translate(40, 20)" filter="url(#glow)">
    <circle cx="80" cy="80" r="76" fill="#070C12" fill-opacity="0.75" />
    <circle cx="80" cy="80" r="75" stroke="url(#grad-bt)" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Outer C Arc -->
    <path d="M 80 16 A 64 64 0 1 0 136 108 L 122 100 A 48 48 0 1 1 80 32 L 80 16 Z" fill="url(#grad-cp)" fill-opacity="0.95" />

    <!-- Right C Opening Bar -->
    <path d="M 108 70 L 140 70 C 142 70 144 72 144 74 L 144 86 C 144 88 142 90 140 90 L 108 90 Z" fill="url(#grad-cp)" />

    <!-- Vortex Blades -->
    <path d="M 80 20 C 50 20, 26 42, 22 70 C 38 58, 58 54, 76 60 C 68 50, 74 36, 80 20 Z" fill="url(#grad-bt)" fill-opacity="0.85" />
    <path d="M 22 70 C 20 100, 38 128, 68 138 C 58 118, 60 96, 74 80 C 54 80, 36 76, 22 70 Z" fill="url(#grad-cp)" fill-opacity="0.9" />
    <path d="M 68 138 C 96 140, 124 124, 134 100 C 116 108, 92 106, 80 90 C 80 108, 76 124, 68 138 Z" fill="url(#grad-cp)" fill-opacity="0.9" />
    <path d="M 76 60 C 92 64, 102 76, 100 92 C 90 80, 76 80, 68 86 C 70 74, 70 66, 76 60 Z" fill="url(#grad-cp)" fill-opacity="0.95" />

    <!-- Inner Highlights -->
    <path d="M 80 24 A 56 56 0 1 0 130 102" stroke="#A5F3FC" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="20 6 6 6" stroke-opacity="0.8" />
    <path d="M 36 76 C 42 108 70 128 102 124" stroke="#C084FC" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.7" />

    <!-- Core Dot -->
    <circle cx="80" cy="80" r="7" fill="#050B14" stroke="url(#grad-cp)" stroke-width="2" />
  </g>

  <!-- Typography -->
  <text x="230" y="110" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" letter-spacing="9" fill="url(#grad-text)">CIRCULUS</text>
  <text x="232" y="145" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" letter-spacing="4" fill="#94A3B8">ENDLESS NETWORKS | SUSTAINABLE FUTURES</text>
</svg>
